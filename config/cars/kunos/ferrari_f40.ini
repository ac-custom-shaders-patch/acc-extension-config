[INCLUDE: common/materials_carpaint.ini]
[INCLUDE: common/materials_interior.ini]
[INCLUDE: common/materials_glass.ini]
[INCLUDE: common/custom_emissive.ini]
CarPaintAware = 5

[Material_CarPaint_Metallic]
Materials = Carpaint, INT_CARPAINT
UseNewFlakes = 0

[SHADER_REPLACEMENT_...]
MATERIALS = Rim
PROP_... = ksDiffuse, 1
PROP_... = ksSpecular, 1
PROP_... = ksSpecularEXP, 100
PROP_... = fresnelC, 1
PROP_... = fresnelEXP, 1

[SHADER_REPLACEMENT_...]
MATERIALS = Rubber
PROP_... = ksSpecular, 0.04

[Material_Plastic_v2]
Materials = Plastic_Black
DetailScale = 10
Brightness = 5

[Material_Plastic_v2]
Materials = INT_Plastic_Black
DetailScale = 10
Brightness = 0.2

[Material_Metal_v2]
Materials = HeadLights, Logos
Metalness = 0.1
Smoothness = 0.1
DetailScale = 1
Brightness = 1

[Material_CarPaint_Metal]
Materials = Machanics

[EXTRA_FX]
MASK_GBUFFER = polymsh_detached39, g_Hood_SUB1

[Material_Glass]
Materials = Glass, HeadLights_GLASS
MaskPass = 1
MaskPassColor = 0,1,0
IOR = 1.7
Refraction = 1
RefractionBias = 1

[CustomEmissive]
Meshes = LIGHT_REAR_ARROW
Resolution = 512, 512
@ = CustomEmissive_Circle, Channel = 3, Mirror, Center = "383, 383", Size = 220, Exponent = 1.3
@ = TurningLightsRear, Channel = 3, Color = 100

[CustomEmissive]
Meshes = g_Hood_SUB6
Resolution = 512, 512
@ = CustomEmissive_Circle, Channel = 2, Mirror, Center = "451, 272", Size = 100, Exponent = 1.2
@ = CustomEmissive_Circle, Channel = 3, Mirror, Center = "340, 96", Size = 220, Exponent = 1.3
@ = TurningLightsFront, Channel = 3, Color = 100
@ = TurningLightsFrontCorner, Channel = 2, Color = 100

[CustomEmissive]
Meshes = LIGHT_BRAKE
Resolution = 512, 512
@ = CustomEmissive_Circle, Channel = 3, Center = "130, 382", Size = 220, Exponent = 1.3
@ = CustomEmissive_Circle, Channel = 2, Center = "130, 382", Size = 220, Exponent = 1.3
@ = ParkingLights, Channel = 3, Color = 100
@ = BrakingLights, Channel = 2, Color = 250

[CustomEmissive]
Meshes = LIGHT_REAR, g_Body_SUB5
Resolution = 512, 512
@ = CustomEmissive_BounceBack, Channel = 0
@ = CustomEmissive_Circle, Channel = 0, Center = "130, 382"
@ = CustomEmissive_Rect, Channel = 0, Center = "151, 180", Size = 250, CornerRadius = 20

[CustomEmissive]
Meshes = LIGHT_REAR_RETRO
Resolution = 512, 512
@ = CustomEmissive_Circle, Channel = 3, Center = "383, 383", Size = 100, Exponent = 1.5 
@ = ReverseLights, Channel = 3

[EXTRA_FX_EMISSIVE_...]
MESHES = LIGHT_FRONT?, g_Hood_SUB6

[Material_Fabric_v2]
Materials = INT_Fabric
DetailScale = 15
Brightness = 0.1

[Material_Fabric_v2]
Materials = INT_Fabric_seats
Brightness = = 1

[Material_LeatherPoked_v2]
Materials = INT_Fabric_dots
DetailScale = 75

[Material_Leather_v2]
Materials = INT_Skin
DetailScale = 25

[Material_Metal_v2]
Materials = INT_Metal_Grey, INT_Rivetti_NM
Brightness = 0.4
Metalness = 0.1
Smoothness = 0.5

[Material_WindscreenBanner]
Materials = INT_GRADIENT
WindscreenMesh = trasp_vetro

[EXTRA_FX_EMISSIVE_...]
MESHES = INT_HR_SUB18
COLOR = 5

[CustomEmissiveMulti]
Meshes = INT_HR_SUB18
Resolution = 1024, 512 
UseEmissive0AsFallback = 1
@ = DashHighlight, Color = "0,0,10"
@ = MultiItem, Role = TURNSIGNAL_LEFT, Center = "92.3, 286.8", Size = 25
@ = MultiItem, Role = TURNSIGNAL_RIGHT, Center = "92.3, 286.8", Size = 25
@ = MultiItem, Role = LIGHT, Center = "156.1, 300.4", Size = 25
@ = MultiItem, Role = HIGHBEAM, Center = "222.6, 241.8", Size = 25
@ = MultiItem, Role = HANDBRAKE, Center = "465.9, 287.2", Size = 25
@ = MultiItem, Role = STALLED, Center = "401.1, 270.3", Size = 25

[ANIMATED_WIPER_...]
