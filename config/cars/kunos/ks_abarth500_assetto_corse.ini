Brightness=1.5

[Material_Aluminium_v2]
Materials=INT_Display_Plate_Alu
Reflectance = 0.2
Metalness = 0.2

[Material_Fabric_v2]
Materials=INT_Mat_Seat_fabric

[SelfLight_Headlights]
POSITION=0, 0.69, 1.16
RANGE=0.2
SPOT=85
SPECULAR_MULT=1
MIRROR=0.561

