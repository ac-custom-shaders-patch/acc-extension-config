[INCLUDE: common/materials_carpaint.ini]
[INCLUDE: common/materials_interior.ini]
[INCLUDE: common/materials_glass.ini]
[INCLUDE: common/custom_emissive.ini]
[INCLUDE: common/selflighting.ini]
[INCLUDE: common/materials_license_plate.ini]
CarPaintAware = 5

[Material_CarPaint_Metallic]
Materials = CAR_CHAS_ext
UseNewFlakes = 0
FresnelC = 0.1
FresnelEXP = 5

[Material_CarPaint_Metallic]
Materials = CAR_lights
UseNewFlakes = 0
FresnelC = 0.1
BrightnessAdjustment = 0.2

[Material_CarPaint_Chrome]
Materials = CAR_RIM, CAR_BMW_logos
BrightnessAdjustment = 0.5
ColoredSpecular = 0.3
AmbientSpecular = 0.1
ClearCoatThickness = 0.1
FresnelC = 0.1
FresnelMax = 1
SpecularBase = 0.1, 150

[EXTRA_FX]
MASK_GBUFFER = REAR_LIGHT_mesh_SUB1, FRONT_LIGHT_mesh_SUB0, polymsh_SUB11, R_DOOR_EXT_mesh_SUB5, L_DOOR_EXT_mesh_SUB1

[Material_Glass]
Materials = CAR_GLASS
IOR = 2.0
MaskPass = 1
MaskPassColor = 0,9,0

[SHADER_REPLACEMENT_...]
MATERIALS = RT_Battistrada
PROP_... = ksDiffuse, 0.3
PROP_... = ksSpecular, 0.1
PROP_... = ksSpecularEXP, 20

[SHADER_REPLACEMENT_...]
MATERIALS = CAR_GLASS_black
PROP_... = ksSpecular, 0.1
PROP_... = ksSpecularEXP, 2000

[SHADER_REPLACEMENT_...]
MATERIALS = CAR_black_plastic_gloss
PROP_... = ksSpecular, 0.05
PROP_... = ksSpecularEXP, 10000

[SHADER_REPLACEMENT_...]
MATERIALS = CAR_chrome
PROP_... = ksSpecular, 1

[Material_Plastic_v2]
Materials = CAR_black_plastic
Brightness = 0.5
Smoothness = 0
Metalness = 0.4
DetailScale = 10


[SelfLight_Headlights]
SELF_LIGHTNING = exterioronly
BOUND_TO = FRONT_LIGHT_mesh_SUB1

[CustomEmissive]
Meshes = Rear_stop, Center_stop
Resolution = 512, 512
@ = CustomEmissive_Circle, Channel = 3, Center = "247.8, 80.9", Size = 350, Exponent = 3
@ = CustomEmissive_Circle, Channel = 2, Center = "14, 1", Size = 350, Exponent = 3
@ = BrakingLights, Channel = 3
@ = BrakingLights, Channel = 2

[CustomEmissive]
Meshes = pos_light
Resolution = 512, 512
@ = CustomEmissive_Circle, Channel = 3, Center = "219, 145", Size = "450", Exponent = 3
@ = ParkingLights, Channel = 3, Color = 100

[CustomEmissive]
Meshes = REAR_LIGHT_mesh_SUB0
Resolution = 512, 512 
@ = CustomEmissive_Color, Channel = 3, Mirror, Color = 1, Normalization = 0.9
@ = TurningLightsRear, Channel = 3

[CustomEmissive]
Meshes = FRONT_LIGHT_mesh_SUB1
Resolution = 512,512
@ = CustomEmissive_Circle, Channel = 3, Mirror, Center = "372, 254", Size = 170, Exponent = 2.9
@ = TurningLightsFront, Channel = 3, Color = "300, 100, 100"

[CustomEmissive]
Meshes = front_light_abbaglianti, front_light_posizione
Resolution = 512, 512
@ = CustomEmissive_Circle, Channel = 3, Center = "76.3, 278", Size = 130, Exponent = 2.2
@ = MultiItem, Role = HIGHBEAM, Center = "358, 420", Size = 130, Color = 100, CornerRadius = 3, Exponent = 1.8
@ = Headlights, Channel = 3, Color = 100

[CustomEmissive]
Meshes = GEO_RearBumper_SUB1
Resolution = 512,512
@ = CustomEmissive_Rect, Channel = 0, Start = "405, 166", Size = "45, 203"
@ = CustomEmissive_BounceBack, Channel = 0

[CustomEmissive]
Meshes = Reverse_light
Resolution = 512,512
@ = CustomEmissive_Circle, Channel = 3, Center = "220, 145", Size = 65,  Exponent = 1.2
@ = ReverseLights, Channel = 3, Color = 100

[EXTRA_FX_EMISSIVE_...]
MESHES = front_light_abbaglianti, front_light_posizione
RANGE = 1.3

[Material_Leather]
Materials = INT_soft_fake_leather
Brightness = 0.8

[Material_Leather_v2]
Materials = INT_brown_leather
Brightness = 1
DetailScale = 1
DetailNormalBlend = 1

[Material_Leather_v2]
Materials = INT_smooth_leather_w_occlusion
DetailScale = 15
DetailNormalBlend = 1

[Material_Leather_v2]
Materials = INT_black_leather_smooth
DetailScale = 0.06

[SHADER_REPLACEMENT_...]
MATERIALS = INT_brown_leather, INT_smooth_leather_w_occlusion
RESOURCE_0 = txDiffuse 
RESOURCE_TEXTURE_0 = Col_Plastic_Black_D.dds

[Material_Leather_v2]
Materials = INT_STEER_black_leather_smooth
Brightness = 0.02
DetailScale = 0.5

[Material_Carbon]
Materials = INT_lacquer_wood
DetailScale = 15

[Material_Plastic_v2]
Materials = INT_black_plastic
DetailScale = 15

[Material_Aluminium_v2]
Materials = INT_aluminium

[CustomEmissive]
Meshes = interno_HI_SUB11
Resolution = 1024, 1024
StartWithWhite = 1
@ = CustomEmissive_Circle, Channel = 0, Center = "252, 762"
@ = DashHighlight, Channel = 0

[CustomEmissiveExtra]
@ = CustomEmissiveExtra_TurnArrows, Position = '0.342, 0.811, 0.23', Gap = 0.01, Normal = '0, 0.3, -1'
@ = CustomEmissiveExtra_Icon, Position = '0.342, 0.821, 0.23', Role = LIGHT, Normal = '0, 0.3, -1', Size = 0.01
@ = CustomEmissiveExtra_Icon, Position = '0.342, 0.831, 0.23', Role = HIGHBEAM, Normal = '0, 0.3, -1', Size = 0.01

[Material_LicensePlate_Europe]
Materials = EXT_PLATE_plastic

[BRAKEDISC_FX]
AMBIENT_MULT = 1
REFLECTION_MULT = 10
RIM_INTERNAL_RADIUS = 0.06
SIMPLIFY_NORMALS_K = 0.5
DISC_INTERNAL_RADIUS_SHARPNESS = 250

[BRAKEDISC_FX_FRONT]
DISC_INTERNAL_RADIUS = 0.105

[BRAKEDISC_FX_REAR]
DISC_INTERNAL_RADIUS = 0.105

[DEFORMING_HOOD]
NAME = MOTORHOOD
OFFSET_Y_MIDDLE = 0.02
OFFSET_Y_END = -0.02
OFFSET_Z_END = 0.0
BULGING_EXTRA = 0.3
BULGING_EXPONENT = 1.0
